services:
  ticket:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      APP_ORIGIN: http://127.0.0.1:8000
      TICKET_DB_PATH: /data/tickets.sqlite3
      LANGSMITH_TRACING: "false"
    volumes:
      - ticket-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  ticket-data:
